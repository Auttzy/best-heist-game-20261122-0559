<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDNIGHT VAULT — a heist game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #0a0d14; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="MIDNIGHT VAULT: sneak past guards and cameras, grab the loot and reach the exit"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
